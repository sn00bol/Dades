name: Android Build & Release Signed APK

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Java Development Kit 20
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '20'
          cache: gradle

      - name: Decrypt Keystore in GitHub Secrets
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks

      - name: Gradle
        run: chmod +x gradlew

      - name: Build APK Release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Cleanning
        if: always()
        run: rm -f app/keystore.jks

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release/
          for file in *.apk; do
            mv "$file" "${file/app/Dades}"
          done

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Dades-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
